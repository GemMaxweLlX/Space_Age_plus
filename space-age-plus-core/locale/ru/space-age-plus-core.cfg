[sap-diary-text]
capture-nauvis=Выстрелил снарядом в гнездо кусак. Не знал чего ожидать. Оно... успокоилось? Теперь сидит и ждёт биофлюс. Странное ощущение.
first-delivery=Отправил груз. Теперь жду. Межпланетная логистика — это отдельное искусство.
asteroid-hit=Большой кусок камня прошёл через секцию хранения. Турели справились но было неприятно. Надо усилить оборону.
deadlock=Всё встало. Железо ждёт медь, медь ждёт железо, железо ждёт медь. Как я вообще допустил это? Сижу и думаю с чего начать распутывать.
base-autonomous=Стою и смотрю как всё крутится без моего участия. Конвейеры едут, манипуляторы работают, роботы летают. Ради этого момента я всё это и строил.
first-decryption=Первый раз читаю текст не написанный человеком. Странное ощущение. Кто-то это писал. Кто-то думал этими словами.
tech-alien=Это не человеческая разработка. Принцип понятен наполовину. Но результат впечатляет.
alien-data-after=Протокол консервации узла 7-Альфа. Расчётный срок работы без обслуживания — 4200 циклов звезды.
alien-data-before=▓▓▓▓ ◈◉◈ ▓▓▓ ◉◈◉◈◉ ▓▓▓▓▓ ◈◉◈◉◈
first-dungeon=Это явно не человеческая постройка. Геометрия неправильная. И всё ещё работает спустя тысячи лет.
bg-corporate=Навигационная система дала сбой. Компания выдала стандартный набор чертежей перед вылетом. Пистолет тоже есть. Не знаю пригодится ли тут.
bg-loner=Сам виноват. Навигационные данные купил у перекупщика. Чертежи собирал сам по крупицам. Пистолет при себе. На всякий случай.
bg-history=Координаты оказались липовыми. Чертежи впрочем настоящие — это хоть радует. Пистолет заряжен. Тихо пока что.
find-cold-blueprints=Кто-то серьёзно готовился к экстремальному холоду. Значит такое место существует в этой системе.
find-solaris-wreck=Какого чёрта тут делает целый корабль? Как он не расплавился при посадке сюда? Это не должно быть возможным.
find-echaris-military=Столько военных чертежей. От чего они так серьёзно защищались? Роботы? Буря? Или что-то ещё?
tech-mk2=Чертёж Mk2 от компании __1__. Значительно лучше моей Mk1. Хотя тут слоты для каких-то модулей. Интересно для чего они.
tech-roboport=Запускает летающих роботов которые сами строят и перевозят. Это меняет всё. Почему у меня не было этого с самого начала.
tech-other-planet=Стоп. Криозащитный купол. Значит место с экстремальным холодом существует в этой системе.
tech-military=Серьёзное оружие. Обычных кусак таким не останавливают. Предыдущий владелец знал с чем столкнётся.
tech-duplicate=Снова тот же чертёж. Хотя качество лучше — предыдущий владелец работал в лучших условиях.
kill-biter-1=Что это вообще такое. Живое, агрессивное, не радо моему присутствию.
kill-biter-10=Реагируют на загрязнение. Чем грязнее — тем их больше. Надо следить за фильтрами.
kill-biter-50=Уже не замечаю. Рутина.
kill-scorch-1=Оно вышло из лавы. Живое. Из лавы. Как это работает биологически?
kill-scorch-10=Быстрые. Опасны в группе. Держаться подальше от гнёзд.
kill-magmar=Этот плюётся лавой. Ожог через броню очень неприятный.
kill-molten=Огромный. Гнездо светилось ярче перед тем как вылез — запомнить этот сигнал.
kill-sentinel=Робот. Патрулирует как будто выполняет задание. Интересно кто его запустил.
emp-disruptor=ЭМИ волна вырубила всех дронов разом. Надо думать как с ним работать.
reinforcements=Не успел убить до сигнала. Сразу пятеро. Overseer умирает первым и быстро — теперь знаю.
kill-ripple=Что-то атаковало снизу. Оставляет ядовитый след в воде.
kill-surf=Водяная струя сбила с ног. Снайпер подводного мира.
kill-abyss=Огромное. Волна повредила три постройки у берега. Держаться от глубоких зон.
kill-blizzard=Появилась из ниоткуда в снегу. Не видно на белом. Очень крепкая. Что она ест на этой пустой планете?
blizzard-storm=В буран их стаи. Не выходить из базы во время бури. Серьёзно.
kill-guardian=Ледяное дыхание остановило три постройки мгновенно. Отступил. Не стыжусь.
kill-frost=Что-то атаковало в темноте. Реагирует на тепло моего обогревателя.
kill-bottomless=Не видел пока не зашёл слишком глубоко. Самые ценные залежи охраняет самое опасное существо. Конечно.
quality-uncommon=Та же технология но лучше. Чертёж детальнее, материалы качественнее. Интересно кто это делал.
quality-rare=Редкий чертёж. Видно что над ним работали долго — каждая деталь выверена. Такое просто так не выбрасывают.
quality-epic=Не понимаю как это вообще оказалось в обломках. Такой чертёж должен был храниться в сейфе.
quality-legendary=Это... идеальная работа. Я держу в руках что-то что большинство инженеров никогда не видели. Осторожно кладу в самый защищённый контейнер.
res-oil=Первая нефть пошла. Теперь начнётся настоящее производство.
res-acid=Осторожно. Это не нефть — это растворит всё что не из правильного материала.
res-lava=Качаю лаву. Горячо но машина справляется. Главное не трогать трубы руками.
res-solaris-lava=Это уже не та лава что на Вулканусе. Обычный насос бы расплавился за минуту. Хорошо что додумался поставить правильное оборудование.
res-cryolite=Что-то из-подо льда. Странный материал — на ощупь холоднее чем должен быть.
res-nivalite=Проводит ток без потерь при таком холоде. Удивительный материал. Жаль что добыть его так сложно.
build-pumpjack=Поставил первую нефтекачалку. Запах уже неприятный но производство того требует.
build-acid-pumpjack=Та же машина что качает нефть — но тут всё в защитном покрытии. Правильное решение.
build-pumpjack-mk2=Mk2 работает заметно быстрее. Зря я так долго тянул с заменой.
build-heavy-pump=Специальный насос для сверхгорячей лавы. Выглядит внушительно. Интересно на сколько его хватит.
build-solaris-offshore=Стандартный насос на ЭТОЙ лаве? Серьёзно? Он продержался четыре секунды. Нужно специальное оборудование.
build-deep-drill=Бурю сквозь лёд. Звук неприятный — как будто планета возражает.
build-underwater-drill=Добываю что-то со дна океана. Никогда не думал что буду заниматься таким.
sat-first=Запустил первый спутник. Ненадёжная конструкция если честно — но лучше пока нет. Посмотрим что найдёт.
sat-nothing=Ничего. Упал обратно. Значит либо там ничего нет либо спутник был слишком плохой. Скорее второе.
sat-five-lost=Уже пятый спутник потерян. Но каждый раз я понимаю что делал не так. Следующий будет лучше.
sat-mk2-ready=Наконец-то. Все эти потери были не зря — теперь я знаю как сделать это правильно.
sat-weak-signal=Спутник что-то нашёл перед тем как упал. Сигнал слабый — только направление и примерное расстояние. Там что-то есть. Надо разведать подробнее.
scout-solaris=Значит там очень горячо. Очень. Нужна серьёзная подготовка прежде чем туда лететь.
scout-echaris=Спутник зафиксировал постоянные электромагнитные бури и... движение на поверхности? Там что-то есть. Живое или нет — пока неясно.
scout-aquara=Почти полностью покрыта водой. Острова есть но маленькие. Интересно что живёт в той воде.
scout-nivar=Лёд. Везде лёд. И судя по данным — очень холодно. Даже по меркам космоса.
first-visit=Вот я и здесь. Данные с орбиты одно — стоять на поверхности совсем другое.
first-train=Первый поезд пошёл. Громко. Очень громко. Но везёт столько сколько мне раньше не снилось.
first-reactor=Запустил реактор. Теперь проблема энергии решена надолго. Главное не забывать про охлаждение.
first-robot=Маленький летающий помощник. Строит сам, чинит сам. Почему я не сделал это раньше.
first-rocket=Ракета ушла. Всё что я строил последние часы — в этом моменте. Смотрю в небо пока не скрылась из виду.
first-platform=Вот значит как выглядит космос изнутри. Тихо. Очень тихо. И очень далеко до всего.
capture-starved=Забыл про биофлюс. Улей вернулся к врагам. Теперь снова надо его захватывать. Не забывать — это не просто постройка, это живое.
capture-sa=Та же механика что на Наувисе но существо совсем другое. Интересно насколько оно понимает что происходит.
death-biters=Зашёл слишком близко к гнезду. Их было много. Это моя ошибка — надо было смотреть на карту.
death-solaris=Один неверный шаг. Лава быстрее чем кажется. Хорошо что чертежи не сгорели вместе со мной.
death-nivar=Ушёл слишком далеко от базы. Обогреватель не успел. Холод здесь не шутит — он просто убивает.
survived=Здоровья осталось на один удар. Отступил. Иногда отступить — это правильное решение.
journal-last=Последняя запись обрывается на полуслове. Понятно что случилось дальше. Молчу какое-то время. Потом иду дальше — у меня нет другого выбора.
journal-own=Это наш корабль. Регистрационный номер совпадает. Значит кто-то из наших был здесь до меня. Интересно что с ним случилось. Ищу журнал.
jettisoned-card=Нет. Нет нет нет. Только что выбросил редкий чертёж. Он улетел в космос. Надеюсь его подберёт сборщик метеоритов. Когда-нибудь.
buildings-1000=Не считал специально — просто увидел счётчик. Тысяча построек. С одним пистолетом я сюда прилетел.
away-from-home=Когда я последний раз был дома? Смотрю на карту. Наувис — маленькая точка в углу. Надо бы заехать. Проверить что там не развалилось без меня.
journal-ironveil=Отчёт № 114. Экспедиция прибыла в систему согласно графику. Потери оборудования в пределах допустимого. Руководству рекомендовано пересмотреть бюджет на защиту периметра.
journal-kessel=Цикл 37. Давление в контуре 2 — норма. Сборщик 4 — износ подшипника 61%. Замена через 9 циклов.
journal-aether=Образцы грунта показывают аномальную теплопроводность. Гипотеза: под поверхностью есть полости. Прошу разрешения на глубинное бурение — данные приложены.
journal-redstone=Контакт на востоке. Двое ранены. Отошли к посадочной зоне. Боезапас — треть. Ждём приказа.
journal-novum=День 12! Сегодня впервые увидели восход сразу двух лун. Команда в восторге. Записываю всё — когда-нибудь это прочитают дети в школе!
journal-cascade=Схема охлаждения пересчитана. Запас по теплу 14%. Расхождение с проектом — 0,3%, в пределах допуска. Продолжаю монтаж.
journal-loner=Опять сломалось. Опять чиню. Кто вообще придумал эту планету. Еда на три дня. Ладно. Справлюсь. Наверное.

[sap-no-delivery]
needs-tech=Обычная капсула не выдержит __1__ — нужна технология «__2__». Капсула вернулась в хаб.
returned=Хардкор: доставка с платформы на __1__ запрещена — капсула вернулась в хаб.

[tips-and-tricks-item-name]
sap-briefing=Space Age+
sap-oxygen=Кислород
sap-hidden-tree=Скрытое дерево технологий
sap-decipherer=Дешифратор и ЛЛК
sap-exploration=Разведка планет
sap-quality-tech=Технологии разного качества
sap-capture=Захват ульев на планетах Space Age+
sap-diary=Дневник инженера

[tips-and-tricks-item-description]
sap-briefing=Space Age+ добавляет кислород, скрытое дерево технологий, разведку планет спутниками, космический мусор и четыре новых мира. Каждая механика включается и выключается в настройках мода, есть готовые наборы «Лёгкий / Обычный / Хардкор».
sap-oxygen=На [planet=vulcanus], [planet=fulgora], [planet=gleba], [planet=aquilo] и планетах Space Age+ нет пригодного воздуха.\nБез модульной брони персонаж сразу начинает задыхаться. [item=modular-armor] даёт экстренную систему на 30 секунд, каждый [item=sap-oxygen-tank-equipment] в сетке брони — ещё 1-3 минуты.\n[entity=sap-oxygen-distributor] создаёт вокруг себя зону с воздухом, в ней баллоны заполняются. Кислород дают [entity=sap-oxygen-generator] (везде) и [entity=sap-atmospheric-collector] (только при атмосфере своей планеты, с расходником).
sap-hidden-tree=Большинство технологий скрыто. Их чертежи — карты данных: ищите [entity=sap-data-wreck] на планетах, а позже — хранилища древней расы.\nКатегория карты определяет, какие технологии она может открыть, а качество карты — их качество.
sap-decipherer=Положите в [entity=sap-decipherer] карту данных и колбы (по 10 каждого вида) и нажмите «Расшифровать». Колбы задают уровень технологий. Выберите одну из трёх — она появится в дереве, её исследуют в лаборатории. «Обновить» даёт новый список, но может сломать карту.\n[entity=sap-logic-lab] работает без карты: тратит колбы и с небольшим шансом предлагает две технологии обычного качества.
sap-exploration=Постройте [entity=sap-telescope] на [planet=nauvis] — откроется технология спутника 1 поколения.\n[item=sap-satellite-mk1] ненадёжен: с шансом находит планету (её технология полёта становится видна). После 10 запусков открывается [item=sap-satellite-mk2] — он полностью разведывает планету и открывает полёт к ней.
sap-quality-tech=Карта лучшего качества предлагает технологии лучшего качества. Открыв редкую версию, вы открываете и необычную — исследуйте любую. Постройки технологии получают бонус: продуктивность, скорость и экономию энергии. Позже можно исследовать версию лучше.
sap-capture=Для гнёзд каждой планеты нужна своя ракета захвата — технология «Перекалибровка захватчика». Захваченное гнездо ест только корм своей планеты (биофлюс + местные ресурсы); без корма оно снова становится вражеским. Механитов Echaris захватить нельзя.
sap-diary=Клавиша J открывает дневник. Инженер комментирует находки, существ, технологии и важные моменты. При первом открытии выберите предысторию — она задаёт тон дневника.

[tips-and-tricks-item-category-name]
space-age-plus=Space Age+
