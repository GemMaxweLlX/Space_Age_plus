[technology-description]
sap-pioneer-science-pack=Делается только на Наувисе. Нужна технологиям Space Age+, связанным с этой планетой.
sap-tectonic-science-pack=Делается только на Вулканусе. Нужна технологиям Space Age+, связанным с этой планетой.
sap-ionic-science-pack=Делается только на Фульгоре. Нужна технологиям Space Age+, связанным с этой планетой.
sap-symbiotic-science-pack=Делается только на Глебе. Нужна технологиям Space Age+, связанным с этой планетой.
sap-cryostasis-science-pack=Делается только на Аквило. Нужна технологиям Space Age+, связанным с этой планетой.
sap-alien-geometry=+10% к продуктивности добычи. Открывается только инопланетной картой данных.
sap-alien-conservation=+20% к скорости исследований. Открывается только инопланетной картой данных.
sap-alien-lattice=+1 к грузоподъёмности роботов. Открывается только инопланетной картой данных.
sap-high-grade-fluids=Трубы сверхвысоких температур, помпа Mk2, сверхпрочный насос, нефтекачалка Mk2. Открывается на Solaris, работает везде.
sap-cistern=Цистерны на 500 единиц для всех жидкостей, которые разливаются в бочки.
sap-decipherer=Дешифратор и логический лабораторный комплекс: открывают скрытые технологии из карт данных.
sap-telescope=Телескоп на Наувисе показывает силуэты ближайших тел.
sap-satellite-mk1=Ненадёжный поисковый спутник. Каждый запуск — опыт для спутника 2 поколения.
sap-satellite-mk2=Надёжный спутник для полной разведки планет.
sap-oxygen-systems=Генератор, коллектор, распределитель кислорода и баллоны для брони. Без воздуха на Вулканусе, Фульгоре, Глебе и Аквило персонаж теряет здоровье.

