[mod-name]
space-age-plus-core=Space Age+ Core

[mod-description]
space-age-plus-core=Общие механики Space Age+: кислород, исследование планет, переосмысление технологий, дневник инженера, захват ульев, жидкости высокого класса.

[mod-setting-name]
sap-exploration-vanilla-planets=Исследование: ванильные планеты тоже через спутники
sap-oxygen-enabled=Кислород: включить систему
sap-oxygen-death-speed=Кислород: скорость смерти без воздуха
sap-oxygen-tank-size=Кислород: объём баллона
sap-oxygen-distributor-radius=Кислород: радиус пузыря распределителя
sap-hardcore-strict-oxygen=Хардкор: строгий кислород
sap-hardcore-decipher-only=Хардкор: только дешифратор
sap-hardcore-satellite=Хардкор: спутник 1 поколения

[mod-setting-description]
sap-exploration-vanilla-planets=Если включено, технологии полёта на Вулканус, Фульгору, Глебу и Аквило тоже скрыты, пока планету не разведает спутник 2 поколения. Планеты Space Age+ всегда открываются через спутники.
sap-oxygen-enabled=Если выключено, персонажи не тратят кислород ни на одной планете.
sap-oxygen-death-speed=Как быстро персонаж теряет здоровье с пустым баллоном.
sap-oxygen-tank-size=Запас одного баллона в броне: малый — 1 мин, средний — 2 мин, большой — 3 мин. Модульная броня сама по себе даёт 30 с (экстренная система), без модульной брони запаса нет.
sap-oxygen-distributor-radius=Радиус зоны с воздухом вокруг работающего распределителя (в тайлах).
sap-hardcore-strict-oxygen=Без кислорода персонаж умирает в 3 раза быстрее. Действует на всех планетах.
sap-hardcore-decipher-only=ЛЛК не работает, технологии открываются только через дешифратор.
sap-hardcore-satellite=Для спутника 2 поколения нужно 30-50 запусков вместо 10, шанс находки ниже, спутник падает быстрее.

