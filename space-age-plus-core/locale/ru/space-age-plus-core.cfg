sap-oxygen-electrolysis=Кислород из воды
sap-oxygen-from-calcite=Кислород из кальцита
sap-oxygen-collection-fulgora=Сбор воздуха (Фульгора)
sap-oxygen-collection-gleba=Сбор воздуха (Глеба)
sap-oxygen-collection-aquilo=Сбор воздуха (Аквило)
sap-oxygen-distribution=Распределение кислорода

