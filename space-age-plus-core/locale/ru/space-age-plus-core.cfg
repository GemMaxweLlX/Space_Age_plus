[entity-description]
sap-telescope=Постройте на Наувисе, чтобы увидеть силуэты небесных тел. Открывает технологию спутника 1 поколения.
sap-atmospheric-collector=Собирает местный воздух. Для каждой планеты свой рецепт. Не работает без атмосферы.
sap-oxygen-generator=Производит кислород из ресурсов. Работает везде.
sap-oxygen-distributor=Расходует кислород и создаёт вокруг себя зону с воздухом. Внутри зоны баллон заполняется.

