gui-remaining=Кислород: __1__ с
gui-refilling=Кислород: __1__ с (заполняется)
gui-no-supply=Нет запаса воздуха! Нужна модульная броня или распределитель.
gui-in-bubble=Зона распределителя
gui-respawn-grace=Временный запас после возрождения: __1__ с
