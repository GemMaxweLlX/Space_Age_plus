[entity-description]
sap-decipherer=Карта данных + колбы → выбор из трёх скрытых технологий категории карты. Выбранная технология появляется в дереве, её исследуют в лаборатории.
sap-logic-lab=Без карты данных: тратит колбы, с небольшим шансом предлагает две случайные технологии обычного качества.
sap-data-wreck=Обломки чужого корабля. Внутри может быть карта данных.
sap-starting-wreck=Обломки рядом с местом высадки. Похоже, там чьи-то чертежи.
sap-telescope=Постройте на Наувисе, чтобы увидеть силуэты небесных тел. Открывает технологию спутника 1 поколения.
sap-atmospheric-collector=Собирает местный воздух. Для каждой планеты свой рецепт. Не работает без атмосферы.
sap-oxygen-generator=Производит кислород из ресурсов. Работает везде.
sap-oxygen-distributor=Расходует кислород и создаёт вокруг себя зону с воздухом. Внутри зоны баллон заполняется.

