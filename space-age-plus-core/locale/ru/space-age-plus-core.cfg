[item-description]
sap-satellite-mk1=Ненадёжный поисковый спутник. Запускается ракетой на орбиту, падает после работы. Может найти неизвестное тело.
sap-satellite-mk2=Надёжный спутник. Полностью разведывает найденное тело и открывает технологию полёта к нему.
sap-oxygen-tank-equipment=Модуль брони. Каждый баллон добавляет запас воздуха вне зоны распределителя.
sap-air-filter=Расходник коллектора на Фульгоре.
sap-biofilter=Расходник коллектора на Глебе.
sap-air-concentrator=Расходник коллектора на Аквило.

