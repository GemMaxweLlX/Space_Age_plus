telescope-built=Телескоп собран. В системе видны силуэты неизвестных тел: __1__. Нужен спутник, чтобы узнать больше.
mk1-found=Спутник что-то нашёл перед тем как упал. Слабый сигнал: __1__, примерно __2__ км. Там что-то есть.
mk1-nothing=Ничего. Спутник упал обратно. Либо там ничего нет, либо спутник был слишком плохой.
mk2-ready=Наконец-то. Все эти потери были не зря — теперь я знаю, как сделать спутник правильно. Технология спутника 2 поколения доступна.
mk2-scouted=Полная разведка: __1__. Технология полёта доступна для исследования.
mk2-nothing=Спутник 2 поколения не нашёл ничего нового. Все известные тела уже разведаны.

