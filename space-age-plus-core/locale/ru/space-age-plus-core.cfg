sap-telescope=Телескоп
sap-satellite-mk1=Спутник 1 поколения
sap-satellite-mk2=Спутник 2 поколения
sap-oxygen-tank-equipment=Кислородный баллон
sap-air-filter=Воздушный фильтр
sap-biofilter=Биофильтр
sap-air-concentrator=Концентратор воздуха

[item-description]
sap-satellite-mk1=Ненадёжный поисковый спутник. Запускается ракетой на орбиту, падает после работы. Может найти неизвестное тело.
sap-satellite-mk2=Надёжный спутник. Полностью разведывает найденное тело и открывает технологию полёта к нему.
sap-oxygen-tank-equipment=Модуль брони. Каждый баллон добавляет запас воздуха вне зоны распределителя.
sap-air-filter=Расходник коллектора на Фульгоре.
sap-biofilter=Расходник коллектора на Глебе.
sap-air-concentrator=Расходник коллектора на Аквило.

[recipe-name]
sap-oxygen-electrolysis=Кислород из воды
sap-oxygen-from-calcite=Кислород из кальцита
sap-oxygen-collection-fulgora=Сбор воздуха (Фульгора)
sap-oxygen-collection-gleba=Сбор воздуха (Глеба)
sap-oxygen-collection-aquilo=Сбор воздуха (Аквило)
sap-oxygen-distribution=Распределение кислорода

