[technology-description]
sap-telescope=Телескоп на Наувисе показывает силуэты ближайших тел.
sap-satellite-mk1=Ненадёжный поисковый спутник. Каждый запуск — опыт для спутника 2 поколения.
sap-satellite-mk2=Надёжный спутник для полной разведки планет.
sap-oxygen-systems=Генератор, коллектор, распределитель кислорода и баллоны для брони. Без воздуха на Вулканусе, Фульгоре, Глебе и Аквило персонаж теряет здоровье.

