[mod-name]
space-age-plus-core=Space Age+ Core

[mod-description]
space-age-plus-core=Shared mechanics for Space Age+: oxygen, planet exploration, reworked technology tree, engineer's diary, hive capture, high-grade fluids.

[mod-setting-name]
sap-oxygen-enabled=Oxygen: enable system
sap-oxygen-death-speed=Oxygen: suffocation speed
sap-oxygen-tank-size=Oxygen: tank size
sap-oxygen-distributor-radius=Oxygen: distributor bubble radius
sap-hardcore-strict-oxygen=Hardcore: strict oxygen
sap-hardcore-decipher-only=Hardcore: decipherer only
sap-hardcore-satellite=Hardcore: generation 1 satellite

[mod-setting-description]
sap-oxygen-enabled=When disabled, characters never use oxygen on any planet.
sap-oxygen-death-speed=How fast a character loses health with an empty tank.
sap-oxygen-tank-size=How long a tank lasts outside a bubble: small 1 min, medium 3 min, large 7 min.
sap-oxygen-distributor-radius=Radius of the breathable zone around a working distributor, in tiles.
sap-hardcore-strict-oxygen=Without oxygen a character dies 3 times faster. Applies to every planet.
sap-hardcore-decipher-only=The logic lab complex is disabled; technologies are unlocked only through the decipherer.
sap-hardcore-satellite=The generation 2 satellite needs 30-50 launches instead of 10, with a lower find chance and faster decay.

