[sap-diary-text]
story-stay=The company ship is waiting in orbit. I sent them an empty report and switched off the beacon. The nexus is gathering strength again, quietly, like the cores under the ground. It seems that was not the last choice.
story-recharged=The nexus hums again. The paths I did not take are still open. And deeper inside there is a new one. It was not there before, or I did not see it.
story-return=I went up to orbit and looked at the system one last time. The factories will run without me until the ore runs out. At home they will ask what I found. I will show them the diary. Maybe they will understand.
story-ending-unity=I chose again and again, and every time the nexus answered. Now there is no choice left in it, only a path where ours and theirs can no longer be told apart. Guardians stand by my factories, their knowledge flows into my labs, and nobody under the planets sleeps alone any more. I do not need the company. This is our home now.
story-dungeon=There was an entrance under the vault. The stairs go deeper than this planet's geology should allow. Whoever built this did not want to be found. But they wanted their keys to be.
story-core-nauvis=The core is warm. When I picked it up, a map of the system flashed on my visor: five points, then nine. They were here before us. Nauvis was their garden, not their home.
story-core-vulcanus=The core holds a mining log. They dug deeper than we do. Vulcanus fed their machines until it started poisoning them with metal in their lungs.
story-core-fulgora=Fulgora was not always a scrapyard. It was their archive: vault cities under domes. The lightning came later. Or it was called.
story-core-gleba=They bred Gleba's life. Not all of it, but the pentapods answer the core's signal like dogs answer a whistle. If they were made as guards, what were they guarding?
story-core-aquilo=Cold preserves. They knew it and laid their sleepers here: thousands of capsules under the ice. None of them opened. The core remembers their names. I do not.
story-core-solaris=Here they tried to hold a star in their hands. Scraps of calculations, charts that all break off at the same point. After that point the core is silent.
story-core-echaris=The mechanites are not their enemies. They are their hands, left without owners. The storms are a fault in a program nobody can stop. Except, maybe, the nexus.
story-core-aquara=Aquara's ocean was their last refuge. They went under the water when there was nothing left to breathe on the surface. My oxygen tank suddenly looks like very familiar technology.
story-core-nivar=There is a diagram in Nivar's caves. All the cores meet at one point: the nexus. It can only be built from what every planet provides. They left instructions. So they were waiting for someone.
story-core-other=Another core. It speaks with the same voice as the others, only quieter.
story-pattern=Three cores. They speak with one voice and point the same way. There must be a place where they meet. It seems to need a core from every planet and everything each planet can make.
story-nexus=The nexus is built. It hums like the cores, only louder. There are three paths inside, and I can only take one. The company wants a report. I will not tell the company anything yet.
story-ending-restore=I sent the signal. Capsules opened under the ice, the guardians lowered their weapons. They did not thank me. They just looked at me the way you look at someone who repaid a debt. The system is no longer empty. And no longer only ours.
story-ending-inherit=I took everything the nexus held. Their knowledge runs in my labs, their machines on my lines. The company is pleased. The cores went dark one by one. Sometimes I think I robbed a graveyard.
story-ending-seal=I closed the nexus. The dungeons collapsed, the cores went cold, the signal faded. Whatever sleeps under the planets will keep sleeping. The energy they held went into the rock, and the drills work easier now. Let that be the only thing we take from them.
capture-nauvis=Fired a capsule into a biter nest. Didn't know what to expect. It... calmed down? Now it sits and waits for bioflux. A strange feeling.
first-delivery=Cargo sent. Now I wait. Interplanetary logistics is an art of its own.
asteroid-hit=A big chunk of rock went through the storage section. The turrets handled it, but it was unpleasant. Need stronger defences.
deadlock=Everything stopped. Iron waits for copper, copper waits for iron, iron waits for copper. How did I let this happen? Sitting here wondering where to start untangling.
base-autonomous=Standing and watching everything turn without me. Belts moving, inserters working, robots flying. This is the moment I built all this for.
first-decryption=The first time I'm reading text not written by a human. A strange feeling. Someone wrote this. Someone thought in these words.
tech-alien=This isn't a human design. I half understand the principle. But the result is impressive.
alien-data-after=Node 7-Alpha conservation protocol. Estimated maintenance-free operating time: 4200 star cycles.
alien-data-before=▓▓▓▓ ◈◉◈ ▓▓▓ ◉◈◉◈◉ ▓▓▓▓▓ ◈◉◈◉◈
first-dungeon=This is clearly not a human structure. The geometry is wrong. And it still works after thousands of years.
bg-corporate=The navigation system failed. The company issued a standard set of blueprints before departure. There's a pistol too. Not sure it'll be useful here.
bg-loner=My own fault. Bought the navigation data from a reseller. Gathered the blueprints myself, bit by bit. Pistol on me. Just in case.
bg-history=The coordinates turned out to be fake. The blueprints are real though, at least that's something. Pistol's loaded. Quiet so far.
find-cold-blueprints=Someone was seriously preparing for extreme cold. So a place like that exists in this system.
find-solaris-wreck=What the hell is a whole ship doing here? How didn't it melt on landing? This shouldn't be possible.
find-echaris-military=So many military blueprints. What were they defending against so seriously? Robots? The storm? Something else?
tech-mk2=An Mk2 blueprint from __1__. Much better than my Mk1. There are slots for some kind of modules, though. Wonder what they're for.
tech-roboport=Launches flying robots that build and haul on their own. This changes everything. Why didn't I have this from the start.
tech-other-planet=Wait. A cryo shield dome. So a place with extreme cold exists in this system.
tech-military=Serious weaponry. You don't stop ordinary biters with this. The previous owner knew what they'd be facing.
tech-duplicate=The same blueprint again. Better quality though; the previous owner worked in better conditions.
kill-biter-1=What even is that. Alive, aggressive, not happy I'm here.
kill-biter-10=They react to pollution. The dirtier it gets, the more of them. Need to watch the filters.
kill-biter-50=I barely notice anymore. Routine.
kill-scorch-1=It came out of the lava. Alive. Out of lava. How does that work biologically?
kill-scorch-10=Fast. Dangerous in groups. Stay away from the nests.
kill-magmar=This one spits lava. A burn through armor is very unpleasant.
kill-molten=Huge. The nest glowed brighter before it crawled out. Remember that sign.
kill-sentinel=A robot. Patrols like it's carrying out orders. I wonder who launched it.
emp-disruptor=An EMP wave knocked out all the robots at once. Need to figure out how to deal with it.
reinforcements=Didn't kill it before the signal. Five at once. The Overseer dies first and fast. Now I know.
kill-ripple=Something attacked from below. Leaves a poison trail in the water.
kill-surf=A water jet knocked me off my feet. The sniper of the underwater world.
kill-abyss=Huge. The wave damaged three buildings by the shore. Stay away from deep water.
kill-blizzard=Came out of nowhere in the snow. Invisible against the white. Very tough. What does it even eat on this empty planet?
blizzard-storm=In a blizzard they come in packs. Do not leave the base during a storm. Seriously.
kill-guardian=Its icy breath stopped three buildings instantly. I retreated. Not ashamed of it.
kill-frost=Something attacked in the dark. It reacts to my heater's warmth.
kill-bottomless=Didn't see it until I went too deep. The richest deposits guarded by the most dangerous creature. Of course.
quality-uncommon=The same technology, but better. A more detailed blueprint, better materials. I wonder who made it.
quality-rare=A rare blueprint. You can tell someone worked on it for a long time: every detail is precise. You don't just throw something like this away.
quality-epic=I don't understand how this ended up in a wreck. A blueprint like this should have been kept in a safe.
quality-legendary=This is... perfect work. I'm holding something most engineers have never seen. Carefully placing it in the most protected container.
res-oil=The first oil is flowing. Now real production begins.
res-acid=Careful. This isn't oil: it dissolves anything not made of the right material.
res-lava=Pumping lava. Hot, but the machine copes. Just don't touch the pipes.
res-solaris-lava=This isn't the lava from Vulcanus. An ordinary pump would melt in a minute. Good thing I thought to use the right equipment.
res-cryolite=Something from under the ice. Strange material: colder to the touch than it should be.
res-nivalite=Conducts current without loss in this cold. Amazing material. Too bad it's so hard to get.
build-pumpjack=Placed the first pumpjack. The smell is already unpleasant, but production demands it.
build-acid-pumpjack=The same machine that pumps oil, but everything here is coated. The right call.
build-pumpjack-mk2=The Mk2 is noticeably faster. I waited too long to replace it.
build-heavy-pump=A special pump for superheated lava. Looks impressive. I wonder how long it'll last.
build-solaris-offshore=A standard pump on THIS lava? Seriously? It lasted four seconds. Special equipment needed.
build-deep-drill=Drilling through the ice. An unpleasant sound, as if the planet objects.
build-underwater-drill=Mining something from the ocean floor. Never thought I'd be doing this.
sat-first=Launched the first satellite. Unreliable design, honestly, but there's nothing better yet. Let's see what it finds.
sat-nothing=Nothing. Fell back. Either there's nothing out there or the satellite was too poor. Probably the latter.
sat-five-lost=The fifth satellite lost. But each time I understand what I did wrong. The next one will be better.
sat-mk2-ready=Finally. All those losses were not in vain: now I know how to do it right.
sat-weak-signal=The satellite found something before it fell. A weak signal: only a direction and a rough distance. Something is out there. Need a closer look.
scout-solaris=So it's very hot there. Very. Serious preparation needed before flying there.
scout-echaris=The satellite recorded constant electromagnetic storms and... movement on the surface? Something is there. Alive or not, unclear for now.
scout-aquara=Almost entirely covered in water. There are islands, but small. I wonder what lives in that water.
scout-nivar=Ice. Ice everywhere. And judging by the data, very cold. Even by space standards.
first-visit=Here I am. Data from orbit is one thing; standing on the surface is something else entirely.
first-train=The first train is running. Loud. Very loud. But it carries more than I ever dreamed of.
first-reactor=Started the reactor. The energy problem is solved for a long time. Just don't forget the cooling.
first-robot=A little flying helper. Builds by itself, repairs by itself. Why didn't I do this earlier.
first-rocket=The rocket is gone. Everything I've built over the last hours went into this moment. Watching the sky until it disappears.
first-platform=So this is what space looks like from inside. Quiet. Very quiet. And very far from everything.
capture-starved=Forgot the food. The hive went back to the enemy. Now I have to capture it again. Remember: it's not just a building, it's alive.
capture-sa=The same mechanism as on Nauvis, but a completely different creature. I wonder how much it understands of what's happening.
death-biters=Got too close to the nest. There were many. My mistake: I should have checked the map.
death-solaris=One wrong step. Lava is faster than it looks. Good thing the blueprints didn't burn with me.
death-nivar=Went too far from the base. The heater didn't make it in time. The cold here doesn't joke: it just kills.
survived=One hit of health left. I retreated. Sometimes retreating is the right call.
journal-last=The last entry breaks off mid-word. It's clear what happened next. I stay silent for a while. Then move on: I have no other choice.
journal-own=It's our ship. The registration number matches. So one of us was here before me. I wonder what happened to them. Looking for the log.
jettisoned-card=No. No no no. Just threw a rare blueprint overboard. It flew into space. Hope the collector picks it up. Someday.
buildings-1000=Wasn't counting on purpose, just saw the counter. A thousand buildings. I came here with one pistol.
away-from-home=When was I last home? Looking at the map. Nauvis is a small dot in the corner. Should drop by. Check nothing fell apart without me.
journal-ironveil=Report No. 114. The expedition arrived in the system on schedule. Equipment losses within acceptable limits. Management is advised to revise the perimeter defence budget.
journal-kessel=Cycle 37. Loop 2 pressure nominal. Assembler 4 bearing wear 61%. Replace in 9 cycles.
journal-aether=Soil samples show anomalous thermal conductivity. Hypothesis: there are cavities below the surface. Requesting permission for deep drilling; data attached.
journal-redstone=Contact to the east. Two wounded. Fell back to the landing zone. One third of ammo left. Awaiting orders.
journal-novum=Day 12! Today we saw two moons rise at once for the first time. The crew is thrilled. Writing everything down: one day kids will read this at school!
journal-cascade=Cooling layout recalculated. Thermal margin 14%. Deviation from design 0.3%, within tolerance. Continuing installation.
journal-loner=Broke again. Fixing it again. Who even came up with this planet. Food for three days. Fine. I'll manage. Probably.

[sap-no-delivery]
needs-tech=An ordinary pod would not survive __1__: the __2__ technology is needed. The pod returned to the hub.
returned=Hardcore: platform delivery to __1__ is forbidden; the pod returned to the hub.

