sap-oxygen-tank-equipment=Armor equipment. Each tank adds air supply outside a distributor zone.
sap-air-filter=Collector consumable for Fulgora.
sap-biofilter=Collector consumable for Gleba.
sap-air-concentrator=Collector consumable for Aquilo.

