[technology-description]
sap-decipherer=Decipherer and logic lab complex: unlock hidden technologies from data cards.
sap-telescope=A telescope on Nauvis shows silhouettes of nearby bodies.
sap-satellite-mk1=Unreliable survey satellite. Every launch is experience for the generation 2 satellite.
sap-satellite-mk2=Reliable satellite for full planet surveys.
sap-oxygen-systems=Oxygen generator, collector, distributor and armor tanks. Without air on Vulcanus, Fulgora, Gleba and Aquilo a character loses health.

