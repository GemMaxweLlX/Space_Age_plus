[entity-description]
sap-ancient-nexus=Joins the ancient cores of all planets. Open it to choose an ending.
sap-dungeon-entrance=Leads into this planet's ancient race dungeon.
sap-ancient-power-lock=Insert fuel: when the cycle finishes, the nearby door opens.
sap-ancient-key-lock=Insert an ancient key to open the door. The Keeper carries the key.
sap-ancient-keeper=Carries an ancient key.
sap-alien-vault=A sealed vault of an ancient race. Holds alien data cards and encrypted data.
sap-high-temperature-pipe=Any fluid, including lava. Twice the volume.
sap-pump-mk2=Keeps pressure over long distances: twice as fast.
sap-heavy-duty-pump=2400 units per second, any fluid.
sap-pumpjack-mk2=All fluid resources twice as fast, less energy.
sap-steam-turbine-mk2=Generates power and returns 90% of the steam as water into a neighbouring pipe or tank.
sap-decipherer=Data card + science packs → choose from three hidden technologies of the card's category. The chosen technology appears in the tree and is researched in a lab.
sap-logic-lab=Without a data card: spends science packs and has a small chance to offer two random normal-quality technologies.
sap-data-wreck=Wreckage of someone else's ship. There may be a data card inside.
sap-starting-wreck=Wreckage near the landing site. Looks like someone's blueprints.
sap-telescope=Build on Nauvis to see silhouettes of celestial bodies. Unlocks the generation 1 satellite technology.
sap-atmospheric-collector=Collects local air. Each planet has its own recipe. Does not work without an atmosphere.
sap-oxygen-generator=Produces oxygen from resources. Works anywhere.
sap-oxygen-distributor=Consumes oxygen and keeps a breathable zone around itself. Tanks refill inside the zone.

