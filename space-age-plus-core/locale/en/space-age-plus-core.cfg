[tips-and-tricks-item-description]
sap-story=Ancient vaults have dungeon entrances next to them: one dungeon per planet, each planet with its own layout. Doors open with locks: a power lock (insert fuel) or a key lock (the Keeper in the previous room carries the key). The deepest room holds an ancient core; each core is a chapter of the story in the diary.\n\nThe Ancient nexus ([technology=sap-ancient-nexus]) is built from the cores and science packs of every planet. There you choose an ending: Awakening, Inheritance or The seal. After an ending you can go home (the end), or stay: the nexus recharges and other endings open, and after two different ones a secret ending too.
sap-briefing=Space Age+ adds oxygen, a hidden technology tree, planet exploration with satellites, space debris and four new worlds. Every mechanic can be turned on or off in the mod settings, and there are presets: Casual / Standard / Hardcore.
sap-oxygen=[planet=vulcanus], [planet=fulgora], [planet=gleba], [planet=aquilo] and the Space Age+ planets have no breathable air.\nWithout modular armor a character starts suffocating at once. [item=modular-armor] gives a 30-second emergency system; each [item=sap-oxygen-tank-equipment] in the armor grid adds 1-3 minutes.\n[entity=sap-oxygen-distributor] creates a breathable zone where tanks refill. Oxygen comes from [entity=sap-oxygen-generator] (anywhere) and [entity=sap-atmospheric-collector] (only in its planet's atmosphere, with a consumable).
sap-hidden-tree=Most technologies are hidden. Their blueprints are data cards: look for [entity=sap-data-wreck] on planets, and later for ancient vaults.\nThe card's category decides which technologies it can unlock; its quality decides their quality.
sap-decipherer=Put a data card and science packs (10 of each kind) into the [entity=sap-decipherer] and press Decipher. The packs set the technology level. Choose one of three: it appears in the tree and is researched in a lab. Refresh gives a new list but may break the card.\nThe [entity=sap-logic-lab] works without a card: it spends packs and sometimes offers two normal-quality technologies.
sap-exploration=Build a [entity=sap-telescope] on [planet=nauvis] to unlock the generation 1 satellite.\nThe [item=sap-satellite-mk1] is unreliable: it may find a planet (its travel technology becomes visible). After 10 launches the [item=sap-satellite-mk2] unlocks; it fully surveys a planet and unlocks travel there.
sap-quality-tech=A better card offers better-quality technologies. Unlocking a rare version also unlocks the uncommon one; research either. The technology's buildings get a bonus: productivity, speed and energy savings. A better version can be researched later.
sap-capture=Each planet's nests need their own capture rocket: the Capture recalibration technology. A captured nest eats only its planet's food (bioflux + local resources) and turns hostile again when starved. Echaris Mechanites cannot be captured.
sap-diary=Press J to open the diary. The engineer comments on finds, creatures, technologies and milestones. On first open, choose a background; it sets the diary's tone.

