[mod-setting-description]
sap-story-victory=Show the victory screen after choosing an ending in the Ancient nexus. You can keep playing.
sap-preset=Custom: the individual settings apply. Casual: normal technology tree, vanilla planets without satellites, slow suffocation, large tanks, no hardcore. Standard: hidden tree and satellites for all planets, medium values, no hardcore. Hardcore: everything on: fast suffocation, small tanks and every hardcore option of every planet. A preset overrides the matching individual settings, even if they are changed in game.
sap-techtree-enabled=Most technologies are hidden from the start and unlocked through data cards in the decipherer or the logic lab complex.
sap-llk-chance=Chance that the logic lab complex finds technologies without a data card (10-20%).
sap-exploration-vanilla-planets=When enabled, travel technologies for Vulcanus, Fulgora, Gleba and Aquilo are also hidden until a generation 2 satellite surveys the planet. Space Age+ planets always require satellites.
sap-oxygen-enabled=When disabled, characters never use oxygen on any planet.
sap-oxygen-death-speed=How fast a character loses health with an empty tank.
sap-oxygen-tank-size=Air supply of one armor tank: small 1 min, medium 2 min, large 3 min. Modular armor alone gives 30 s (emergency system); without modular armor there is no supply.
sap-oxygen-distributor-radius=Radius of the breathable zone around a working distributor, in tiles.
sap-hardcore-strict-oxygen=Without oxygen a character dies 3 times faster. Applies to every planet.
sap-hardcore-decipher-only=The logic lab complex is disabled; technologies are unlocked only through the decipherer.
sap-hardcore-satellite=The generation 2 satellite needs 30-50 launches instead of 10, with a lower find chance and faster decay.

