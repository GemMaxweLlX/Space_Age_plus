[tips-and-tricks-item-description]
sap-aquara-briefing=[planet=aquara] — спутник Глебы: океан с маленькими островами. [entity=sap-water-tower] выращивает водоросли, которые портятся; [item=sap-sea-salt] замедляет порчу. Для кислорода нужен осушитель.
sap-aquara-storms=Бури замедляют машины и рождают торнадо, которые ползут к постройкам. [entity=sap-storm-shield] защищает зону, [entity=sap-storm-anchor] притягивает торнадо и запасает их энергию.
