[entity-description]
sap-heat-resistant-belt=60 предметов/с. Не горит, не мёрзнет, вдвое прочнее.
sap-radiator-mk2=Охлаждает машины в радиусе 10 клеток.
sap-heat-pipe-mk2=Выдерживает до 2000°C.
sap-thermoelectric-generator=Пассивная энергия от перепада температур.
sap-coronal-umbrella-mk2=Перехватывает коронарные лучи на ещё большей площади.
sap-fireproof-wall=Не горит и выдерживает контакт с лавой, втрое прочнее.
sap-super-boiler=Получает тепло от захватчика луча, стоящего рядом (до 8 клеток), и делает пар.
sap-super-boiler-mk2=Сверхбойлер с вдвое большей мощностью.
sap-mega-turbine=Огромная выработка. Возвращает 90% пара водой в соседнюю трубу или бак — остальные 10% нужно восполнять (лёд или цистерны с платформы).

sap-coronal-umbrella=Перехватывает коронарные лучи на большой площади. Энергии не даёт.
sap-ray-catcher=Поглощает коронарный луч и превращает его в энергию.
sap-radiator=Пока подключён к сети, охлаждает машины в радиусе 6 клеток и защищает их от перегрева.
sap-scorch=Мелкое лавовое существо. Таранит.
sap-magmar=Плюётся огнём.
sap-molten=Огромное лавовое существо-одиночка. Таран и лавовый след.

