sap-hardcore-solaris-aggressive=Лавовые существа атакуют без провокации.

[space-location-name]
solaris=Solaris

[space-location-description]
solaris=Планета у самого Солнца. Покрыта лавой, день почти не кончается. Коронарные выбросы бьют по поверхности, механизмы перегреваются. Лавовые существа пассивны, пока их не трогать.

[space-connection-name]
vulcanus-solaris=Вулканус — Solaris

