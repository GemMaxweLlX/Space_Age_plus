sap-thermal-science-pack=Made only on Solaris. Needed by Space Age+ technologies tied to this planet.
sap-improved-delivery-capsule=Heat-proof cargo pod plating: without it, cargo pods from a platform cannot land on Solaris (players still can). Ship bulky cargo by rocket.
sap-planet-discovery-solaris=Travel to Solaris, the planet closest to the Sun. Unlocks magmatic ore melting, heat-resistant alloy and the cooling radiator.

