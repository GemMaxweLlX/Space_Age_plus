[tips-and-tricks-item-description]
sap-solaris-briefing=[planet=solaris] sits next to the Sun: lava, almost endless day, no atmosphere (oxygen only from generators).\nCoronal ejections strike the surface: the [entity=sap-coronal-umbrella] intercepts them, the [entity=sap-ray-catcher] turns them into power or into heat for a [entity=sap-super-boiler]. Cargo pods from a platform cannot land without the Improved delivery capsule technology.
sap-solaris-heat=On [planet=solaris] machines heat up: hot → overheated (stopped) → broken. A powered [entity=sap-radiator] cools the machines around it.
