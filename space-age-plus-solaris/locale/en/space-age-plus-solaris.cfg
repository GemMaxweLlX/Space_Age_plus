[entity-description]
sap-heat-resistant-belt=60 items/s. Does not burn or freeze, twice as sturdy.
sap-radiator-mk2=Cools machines within 10 tiles.
sap-heat-pipe-mk2=Withstands up to 2000°C.
sap-thermoelectric-generator=Passive power from the temperature difference.
sap-coronal-umbrella-mk2=Intercepts coronal rays over an even larger area.
sap-fireproof-wall=Fireproof and withstands lava contact, three times as sturdy.
sap-super-boiler=Gets heat from a ray catcher standing nearby (within 8 tiles) and makes steam.
sap-super-boiler-mk2=A super boiler with twice the power.
sap-mega-turbine=Huge output. Returns 90% of the steam as water into a neighbouring pipe or tank; the other 10% must be replenished (ice or tanks from a platform).

sap-coronal-umbrella=Intercepts coronal rays over a large area. Produces no energy.
sap-ray-catcher=Absorbs a coronal ray and converts it into energy.
sap-radiator=While connected to power, cools machines within 6 tiles and protects them from overheating.
sap-scorch=Small lava creature. Rams.
sap-magmar=Spits fire.
sap-molten=Huge solitary lava creature. Rams and leaves a lava trail.

