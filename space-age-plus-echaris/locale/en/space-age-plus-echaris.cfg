[entity-description]
sap-centrifuge-mk2=Twice as fast.
sap-electric-furnace-mk2=Faster and uses less energy.
sap-assembling-machine-mk2plus=Faster than assembling machine 3.
sap-storage-tank-mk2=Twice the volume.
sap-radar-mk2=Twice the range.
sap-roboport-mk2=More slots, faster charging.
sap-logistic-beacon-mk2=A roboport with twice the logistics area.
sap-power-relay-tower=Wires up to 64 tiles, the most the game allows.
sap-echaris-discharger=Chain lightning between enemies, 1.5 times the tesla turret damage.
sap-suppressor-turret=Slows and stuns enemies at a longer range.
sap-emp-flak-cannon=Long-range rocket turret with double damage: takes out an Overseer in time.
sap-modular-reactor=Compact, no water: nuclear fuel straight into electricity (30 MW).
sap-sentinel=Patrol Mechanite. Calls reinforcements when hurt.
sap-stormbringer=Charged by the storm, always empowered. Fast.
sap-disruptor=EMP: nearby turrets shut down and robots lose charge.
sap-annihilator=Slow and heavily armored. Pierces armor.
sap-overseer=Coordinator. Its death raises the alarm.
sap-control-server=Produces Mechanites. Cannot be captured, only destroyed.
sap-control-server-heavy=Produces heavy Mechanites. Cannot be captured, only destroyed.
sap-center-data=Holds mixed data cards. Opens once no control servers remain nearby.
sap-center-suppression=Holds combat technology cards. Opens once no control servers remain nearby.
sap-center-assembly=Holds production and logistics cards. Opens once no control servers remain nearby.
sap-center-energy=Holds energy technology cards. Opens once no control servers remain nearby.
sap-logistic-robot-mk2=Faster, longer flight, built-in protection from the Echaris storm.
sap-construction-robot-mk2=Faster, longer flight, built-in protection from the Echaris storm.
sap-em-turret=Laser turret with increased damage. Mechanites are weak to electricity.

sap-storm-stabilizer=Restores full machine speed in its area during the Echaris magnetic storm. Inside the area robots take no damage and roboports keep working. Several stabilizers do not stack.

