[tips-and-tricks-item-name]
sap-echaris-briefing=Echaris briefing
sap-echaris-mechanites=Mechanites

[tips-and-tricks-item-description]
sap-echaris-briefing=[planet=echaris] is a moon of Fulgora. A permanent magnetic storm runs machines at 50-70%; robots outside a [entity=sap-storm-stabilizer] zone take damage and roboports lose power. Robots Mk2 are storm-proof.
sap-echaris-mechanites=Mechanites guard capture centers holding data cards. Control servers produce them and cannot be captured. A center opens once no servers remain nearby. Without a [entity=sap-force-barrier] the Mechanites reclaim the zone. Disruptors shut down turrets, Sentinels call reinforcements, an Overseer's death raises the alarm.
