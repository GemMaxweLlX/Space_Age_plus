[entity-description]
sap-force-barrier=Пока заряжен, уничтожает Механитов и других врагов в радиусе 12 клеток. Каждый выстрел тратит 5 МДж.
sap-force-barrier-mk2=Радиус 16 клеток, выстрел тратит 3 МДж, запас втрое больше.
sap-centrifuge-mk2=Вдвое быстрее.
sap-electric-furnace-mk2=Быстрее и потребляет меньше энергии.
sap-assembling-machine-mk2plus=Скорость выше, чем у сборочного автомата 3.
sap-storage-tank-mk2=Вдвое больший объём.
sap-radar-mk2=Вдвое больший радиус.
sap-roboport-mk2=Больше слотов, быстрее зарядка.
sap-logistic-beacon-mk2=Роботодок с вдвое большей зоной логистики.
sap-power-relay-tower=Провода до 64 клеток — максимум, который позволяет игра.
sap-echaris-discharger=Цепная молния между врагами, урон в 1.5 раза выше тесла-турели.
sap-suppressor-turret=Замедляет и оглушает врагов на большем расстоянии.
sap-emp-flak-cannon=Дальнобойная ракетная турель с двойным уроном: успевает сбить Overseer.
sap-modular-reactor=Компактный, без воды: ядерное топливо сразу в электричество (30 МВт).
sap-sentinel=Патрульный Механит. Если его ранить, вызывает подкрепления.
sap-stormbringer=Подзаряжается от бури — всегда усилен. Быстрый.
sap-disruptor=ЭМИ: рядом с ним турели отключаются, а дроны разряжаются.
sap-annihilator=Медленный и тяжело бронированный. Пробивает броню.
sap-overseer=Координатор. При его смерти поднимается тревога.
sap-control-server=Производит Механитов. Захватить нельзя — только уничтожить.
sap-control-server-heavy=Производит тяжёлых Механитов. Захватить нельзя — только уничтожить.
sap-center-data=Хранит карты данных смешанного типа. Откроется, когда рядом не останется серверов контроля.
sap-center-suppression=Хранит карты боевых технологий. Откроется, когда рядом не останется серверов контроля.
sap-center-assembly=Хранит карты производства и логистики. Откроется, когда рядом не останется серверов контроля.
sap-center-energy=Хранит карты энергетических технологий. Откроется, когда рядом не останется серверов контроля.
sap-logistic-robot-mk2=Быстрее, дольше летает, встроенная защита от бури Echaris.
sap-construction-robot-mk2=Быстрее, дольше летает, встроенная защита от бури Echaris.
sap-em-turret=Лазерная турель с усиленным уроном. Механиты слабы к электричеству.

sap-storm-stabilizer=Возвращает машинам в своей зоне полную скорость во время магнитной бури Echaris. Внутри зоны дроны не получают урон, а роботодоки работают. Несколько стабилизаторов не складываются.

[recipe-name]
sap-oxygen-collection-echaris=Сбор воздуха (Echaris)

[sap-mechanites]
zone-reclaimed=Механиты отвоевали зону без силового барьера: __1__
center-alarm=Центр вскрыт — тревога! К нему идут Механиты: __1__.
hacked=Взломано Механитов: __1__. Теперь они на вашей стороне.
center-locked=Центр защищён серверами контроля. Сначала уничтожьте серверы рядом.
alarm=Overseer уничтожен — тревога! К месту его гибели идут Механиты: __1__.
wave=Механиты атакуют по расписанию: __1__
