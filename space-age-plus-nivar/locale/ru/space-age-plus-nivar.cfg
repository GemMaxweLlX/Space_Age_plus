[space-location-description]
nivar=Спутник Аквило. Ледяная пустыня, холоднее самого Аквило. Ресурсы есть только в пещерах подо льдом. Криобури замораживают постройки, в бурю Вьюги ходят стаями.
nivar-caves=Тёмные пещеры подо льдом Nivar. Здесь нивалит, криолит и тёмный лёд. Попасть сюда можно только лифтом.

