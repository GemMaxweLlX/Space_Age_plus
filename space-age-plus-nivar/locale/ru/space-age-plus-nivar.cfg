[entity-description]
sap-nivar-elevator=Ставится на поверхности Nivar или в пещерах. На другом уровне появляется пара с общим складом. В окне лифта — кнопка спуска и подъёма.
sap-deep-drill=Бурит сквозь лёд и поднимает ресурсы пещер. Работает только на поверхности Nivar.
sap-cryo-lamp=Яркий свет для тёмных пещер. Не гаснет на сильном морозе.
sap-cryo-heater=Обогрев 2 уровня: пока подключён к сети, защищает машины в радиусе 8 клеток от криобури.
sap-cryo-dome=Пока подключён к сети, защищает от криобури всё в радиусе 24 клеток.

