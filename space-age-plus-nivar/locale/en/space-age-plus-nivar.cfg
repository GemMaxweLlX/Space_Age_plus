[mod-description]
space-age-plus-nivar=Nivar, moon of Aquilo. Ice desert, cryostorms, caves under the ice.

[mod-setting-name]
sap-hardcore-nivar-no-delivery=Hardcore: no platform delivery to Nivar

[mod-setting-description]
sap-hardcore-nivar-no-delivery=Local resources only.

[space-location-name]
nivar=Nivar
nivar-caves=Nivar caves

[space-location-description]
nivar=Moon of Aquilo. An ice desert, colder than Aquilo itself. Resources lie only in the caves under the ice. Cryostorms freeze buildings, and Blizzards roam in packs during storms.
nivar-caves=Dark caves under Nivar's ice. Nivalite, cryolite and dark ice are found here. Reachable only by elevator.

[space-connection-name]
aquilo-nivar=Aquilo — Nivar

