[space-location-description]
nivar=Moon of Aquilo. An ice desert, colder than Aquilo itself. Resources lie only in the caves under the ice. Cryostorms freeze buildings, and Blizzards roam in packs during storms.
nivar-caves=Dark caves under Nivar's ice. Nivalite, cryolite and dark ice are found here. Reachable only by elevator.

