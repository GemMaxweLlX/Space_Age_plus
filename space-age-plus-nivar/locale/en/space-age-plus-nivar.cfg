[tips-and-tricks-item-description]
sap-nivar-briefing=[planet=nivar] is a moon of Aquilo, colder than Aquilo itself. Nothing can be mined on the surface: the resources are in the caves under the ice. Cryostorms freeze machines; [entity=sap-cryo-heater], [entity=sap-cryo-dome], insulating foundation and insulated walls protect them.
sap-nivar-caves=An [entity=sap-nivar-elevator] on the surface creates a partner in the caves with shared storage; its window has a button to go down. The caves are dark: build [entity=sap-cryo-lamp]. The [entity=sap-deep-drill] mines cave ore right from the surface.
