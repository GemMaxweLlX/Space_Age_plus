[entity-description]
sap-insulated-wall=If these walls surround a machine on all four sides (within 16 tiles), it freezes half as fast in a cryostorm.
sap-cryo-heater-mk2=Lower consumption, 12-tile radius.
sap-cryo-pipe=Does not freeze without heating.
sap-cryo-pipe-to-ground=Does not freeze without heating.
sap-cave-belt=Works in extreme cold without heating.
sap-deep-drill-mk2=Twice as fast.
sap-nivar-elevator=Placed on Nivar's surface or in the caves. A partner with shared storage appears on the other level. The elevator window has a button to go down or up.
sap-deep-drill=Drills through the ice and brings up cave resources. Works only on Nivar's surface.
sap-cryo-lamp=Bright light for the dark caves. Keeps working in extreme cold.
sap-cryo-heater=Level 2 heating: while connected to power, protects machines within 8 tiles from cryostorms.
sap-cryo-dome=While connected to power, protects everything within 24 tiles from cryostorms.

