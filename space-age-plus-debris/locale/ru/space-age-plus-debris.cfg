sap-debris=Выброшенное с платформы не исчезает: оно остаётся мусором на этом отрезке маршрута и возвращается кусками, которые ловит [entity=asteroid-collector] и перерабатывает [entity=crusher].\nПосле 20 запусков ракет с планеты на её орбите копятся обломки; иногда они падают вниз.
